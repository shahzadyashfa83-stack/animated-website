<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Love Proposal ❤️</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background -->
<div class="background">

    <div class="moon"></div>

    <div class="stars"></div>

    <div class="hearts"></div>

</div>

<!-- ================= FIRST SCREEN ================= -->

<section id="welcome" class="screen active">

    <div class="glass-card">

        <h1>✨ Someone Has A Surprise For You ✨</h1>

        <p>A Special Love Message Is Waiting ❤️</p>

        <button id="openBtn">
            Open Letter ❤️
        </button>

    </div>

</section>

<!-- ================= PROPOSAL ================= -->

<section id="proposal" class="screen">

    <div class="glass-card white">

        <h2>
            ❤️
            <br><br>
            Will You Be Mine Forever?
            <br>
            💍
        </h2>

        <div class="buttons">

            <button id="yesBtn" class="yes">
                YES ❤️
            </button>

            <button id="noBtn" class="no">
                NO 💔
            </button>

        </div>

    </div>

</section>

<!-- ================= LOVE PAGE ================= -->

<section id="love" class="screen">

    <div class="love-content">

        <div class="teddy">
            🧸
        </div>

        <h1>
            ❤️ I LOVE YOU ❤️
        </h1>

        <h2>
            You Are My Everything
        </h2>

        <h3>
            Our Love Story Begins Here 💍
        </h3>

    </div>

</section>

<script src="scriptt.js"></script>

</body>
</html>
